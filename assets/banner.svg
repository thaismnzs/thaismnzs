<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Banner: inicialização do sistema" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070D"/>
      <stop offset="0.6" stop-color="#0A0F1E"/>
      <stop offset="1" stop-color="#14062B"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="0.55" stop-color="#7B61FF"/>
      <stop offset="1" stop-color="#FF2E97"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00F0FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00F0FF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1000" height="320" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="320" fill="url(#bg)"/>
    <rect width="1000" height="320" fill="url(#grid)"/>

    <!-- HUD -->
    <g transform="translate(840 160)" fill="none" filter="url(#glow)">
      <circle r="118" stroke="#00F0FF" stroke-opacity="0.25" stroke-width="1"/>
      <circle r="100" stroke="#00F0FF" stroke-width="3" stroke-dasharray="60 30 10 30" stroke-opacity="0.9">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle r="78" stroke="#FF2E97" stroke-width="2" stroke-dasharray="4 10" stroke-opacity="0.9">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle r="56" stroke="#7B61FF" stroke-width="4" stroke-dasharray="90 60" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle r="30" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.8">
        <animate attributeName="r" values="28;34;28" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.9;0.2;0.9" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle r="6" fill="#00F0FF" stroke="none">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <path d="M-118 0H-134M118 0H134M0 -118V-134M0 118V134" stroke="#00F0FF" stroke-width="2"/>
    </g>

    <!-- Boot log (loop 12s) -->
    <g font-family="'Courier New', Courier, monospace" font-size="13" fill="#00F0FF">
      <text x="40" y="48" opacity="0">&gt; INICIALIZANDO NÚCLEO ...................... [OK]
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.04;0.92;0.97;1" dur="12s" repeatCount="indefinite"/></text>
      <text x="40" y="70" opacity="0">&gt; CARREGANDO MÓDULOS DE IA .................. [OK]
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.07;0.09;0.92;0.97;1" dur="12s" repeatCount="indefinite"/></text>
      <text x="40" y="92" opacity="0">&gt; SINCRONIZANDO REPOSITÓRIOS ................. [OK]
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.12;0.14;0.92;0.97;1" dur="12s" repeatCount="indefinite"/></text>
      <text x="40" y="114" opacity="0">&gt; ESTABELECENDO CONEXÃO SEGURA ............... [OK]
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.17;0.19;0.92;0.97;1" dur="12s" repeatCount="indefinite"/></text>
      <text x="40" y="136" fill="#FF2E97" font-weight="bold" opacity="0">&gt; ACESSO CONCEDIDO
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.26;0.92;0.97;1" dur="12s" repeatCount="indefinite"/></text>
    </g>

    <!-- Title -->
    <g font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="64" letter-spacing="6" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.29;0.31;0.92;0.97;1" dur="12s" repeatCount="indefinite"/>
      <text x="40" y="218" fill="#00F0FF" opacity="0.55">SEU NOME
        <animate attributeName="x" values="40;40;37;43;40;40" keyTimes="0;0.30;0.31;0.32;0.33;1" dur="12s" repeatCount="indefinite"/></text>
      <text x="40" y="218" fill="#FF2E97" opacity="0.55">SEU NOME
        <animate attributeName="x" values="40;40;43;37;40;40" keyTimes="0;0.30;0.31;0.32;0.33;1" dur="12s" repeatCount="indefinite"/></text>
      <text x="40" y="218" fill="url(#title)" filter="url(#glow)">SEU NOME</text>
    </g>
    <text x="42" y="248" font-family="'Courier New', Courier, monospace" font-size="16" fill="#C9D1D9" letter-spacing="2" opacity="0">FULL STACK DEVELOPER  //  AI ENGINEER  //  OPEN SOURCE
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.34;0.37;0.92;0.97;1" dur="12s" repeatCount="indefinite"/></text>

    <!-- Progress -->
    <rect x="42" y="272" width="420" height="6" rx="3" fill="#00F0FF" fill-opacity="0.12"/>
    <rect x="42" y="272" width="0" height="6" rx="3" fill="url(#title)" filter="url(#glow)">
      <animate attributeName="width" values="0;420;420;0" keyTimes="0;0.28;0.95;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <text x="42" y="302" font-family="'Courier New', Courier, monospace" font-size="12" fill="#00F0FF" letter-spacing="3" opacity="0">[ SYSTEM ONLINE ]
      <animate attributeName="opacity" values="0;0;1;0.4;1;0.4;1;1;0;0" keyTimes="0;0.29;0.31;0.36;0.41;0.46;0.51;0.92;0.97;1" dur="12s" repeatCount="indefinite"/></text>

    <!-- Scanline -->
    <rect x="0" y="-40" width="1000" height="40" fill="url(#scan)">
      <animate attributeName="y" values="-40;320" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <rect width="1000" height="320" rx="14" fill="none" stroke="#00F0FF" stroke-opacity="0.45" stroke-width="2"/>
  </g>
</svg>
